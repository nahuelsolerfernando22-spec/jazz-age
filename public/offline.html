<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>El Cuervo Dorado — Sin conexión</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0506; color: #d9c79a; font-family: Georgia, "Cormorant Garamond", serif; }
      .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
      h1 { font-family: "Limelight", Georgia, serif; letter-spacing: .18em; text-transform: uppercase; font-size: clamp(28px, 5vw, 48px); margin: 0 0 12px; color: #c9a14a; text-shadow: 0 0 18px rgba(201,161,74,.5); }
      p { max-width: 480px; margin: 6px auto; font-style: italic; line-height: 1.5; }
      .rule { width: 120px; height: 1px; background: rgba(201,161,74,.45); margin: 24px auto; }
      a { color: #c9a14a; text-decoration: none; border-bottom: 1px dotted rgba(201,161,74,.6); padding-bottom: 2px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h1>El Cuervo Dorado</h1>
        <p>La puerta de acero está atrancada, encanto. No hay conexión esta noche.</p>
        <div class="rule"></div>
        <p>Volvé a intentar cuando vuelva la luz, o seguí jugando lo que ya está cargado.</p>
        <p style="margin-top: 20px;"><a href="/">─ probar de nuevo ─</a></p>
      </div>
    </div>
  </body>
</html>
